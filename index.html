function dial(c){var C=2*Math.PI*80;return '<div class="dial"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="106" fill="#111"/><circle cx="110" cy="110" r="80" fill="none" stroke="#2a2a2e" stroke-width="18"/><circle cx="110" cy="110" r="80" fill="none" stroke="#ffd21f" stroke-width="18" stroke-dasharray="'+C*c/100+' '+C+'" transform="rotate(-90 110 110)"/><text x="110" y="115" text-anchor="middle" fill="#ffd21f" font-size="30" font-weight="800">'+(c?c+"%":"—")+'</text><text x="110" y="145" text-anchor="middle" fill="#888" font-size="16" letter-spacing="4">ШАНС</text></svg><div class="nd" id="nd" style="transform:rotate('+S.ang+'deg)"><svg viewBox="0 0 220 220"><polygon points="110,208 98,184 122,184" fill="#ffd21f"/></svg></div></div>'}
function up(){if(S.sel>=S.inv.length||(S.sel>=0&&S.inv[S.sel].s))S.sel=-1;var it=S.sel>=0?S.inv[S.sel]:null,s=it?P[it.m]:null,t=S.tg>=0?P[S.tg]:null,c=chn(),tgs=[];
 if(s)P.forEach(function(p,i){if(p[1]>s[1])tgs.push(i)});tgs.sort(function(a,b){return P[a][1]-P[b][1]});
 var h='<h2>Апгрейдер</h2><div style="display:flex;align-items:center;gap:12px"><div class="slot">'+(s?dev(s,44)+'<b style="font-size:12px">'+s[0].slice(0,16)+'</b>':"Выбери телефон в инвентаре внизу")+'</div><span style="font-size:28px;color:var(--mut)">→</span><div class="slot">'+(t?dev(t,44)+'<b style="font-size:12px">'+t[0].slice(0,16)+'</b>':s?"Выбери цель":"Сначала выбери свой телефон")+'</div></div>'+dial(c)+'<button class="btn" id="ub" '+(c?"":"disabled")+' onclick="doUp()">Улучшить</button>';
 if(tgs.length)h+='<div class="hd">ЦЕЛЬ</div><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:10px">'+tgs.slice(0,9).map(function(i){var p=P[i];return '<div class="ic '+(i==S.tg?"on":"")+'" onclick="if(!busy){S.tg='+i+';draw()}">'+dev(p,40)+'<div style="font-weight:700;font-size:11px;margin-top:4px">'+p[0].slice(0,16)+'</div><div style="color:var(--bl);font-weight:800">'+Math.max(3,Math.min(75,Math.round(s[1]/p[1]*70)))+'%</div></div>'}).join("")+'</div>';
 h+='<div class="hd">ТВОЙ ИНВЕНТАРЬ</div>';var l="";S.inv.forEach(function(x,i){if(x.s)return;var p=P[x.m];l+='<div class="ic '+(i==S.sel?"on":"")+'" onclick="if(!busy){S.sel='+i+';S.tg=-1;S.ang=0;draw()}">'+dev(p,40)+'<div style="font-weight:700;font-size:11px;margin-top:4px">'+p[0].slice(0,16)+'</div></div>'});
 return h+(l?'<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:10px">'+l+'</div>':'<div class="mu">В инвентаре пусто. Открой кейс, чтобы получить телефон.</div>')}
function doUp(){var c=chn();if(!c||busy)return;var ok=Math.random()*100<c,pos=ok?c*3.6*(.05+Math.random()*.9):c*3.6+(360-c*3.6)*(.05+Math.random()*.9),tgt=S.tg,src=S.inv[S.sel],ang=1800+((pos-180+360)%360);
 S.inv.splice(S.sel,1);if(ok){giveP(tgt);S.drop--;S.up++}
 S.upr={ok:ok,t:tgt,s:src.m};S.sel=-1;S.tg=-1;S.ang=0;save();busy=1;
 $("ub").disabled=true;$("nd").style.transform="rotate("+ang+"deg)";
 setTimeout(function(){busy=0;fin()},4200)}
function fin(){var r=S.upr;if(!r)return;S.upr=null;S.ang=0;save();draw();
 sheet('<div style="text-align:center;padding:20px 0"><div style="font-size:64px">'+(r.ok?"🎉":"💀")+'</div><h2>'+(r.ok?"Успех!":"Неудача")+'</h2><p class="mu">'+(r.ok?"Получен "+P[r.t][0]:"Телефон сгорел: "+P[r.s][0])+'</p><button class="btn '+(r.ok?"g":"")+'" onclick="shut()">Ок</button></div>')}
/* account */
function chkAch(){AC.forEach(function(a,i){if(!S.ach[i]&&a[2]()){S.ach[i]=1;S.bal+=a[3];toast("Ачивка: "+a[1]+" +"+rub(a[3]))}})}
function acc(){chkAch();var n=S.drop,rk=n<10?"НОВИЧОК":n<50?"ИГРОК":n<200?"ПРОФИ":"ЛЕГЕНДА",f=S.fav>=0?P[S.fav]:null,bl=bpl().l,
 st=[4,3,2,1,0].map(function(r){return '<div style="display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600"><i style="width:14px;height:14px;border-radius:50%;background:'+RC[r]+'"></i><span style="flex:1">'+["Обычных","Редких","Эпических","Легендарных","Ультралегендарных"][r]+'</span><b style="color:'+RC[r]+'">'+S.g[r]+'</b></div><div class="bar" style="background:'+RC[r]+'22"><div style="height:100%;width:'+Math.min(100,S.g[r]/Math.max(1,S.drop)*100)+'%;background:'+RC[r]+';border-radius:6px"></div></div>'}).join("");
 return '<div class="prof" style="--c:'+S.col+'"><div style="display:flex;gap:12px;align-items:center"><div class="av">'+(S.av?'<img src="'+S.av+'">':'👤')+'</div><div style="flex:1"><div style="font-size:20px;font-weight:700">'+S.name+' <span style="background:#fff;color:#4a2a10;border-radius:10px;padding:1px 6px;font-size:12px">★'+bl+'</span></div><div class="chip">♛ '+rk+'</div><div class="chip">📱 '+(f?f[0].toUpperCase().slice(0,12):"НЕТ ЛЮБИМО…")+'</div></div><button class="av" style="width:38px;height:38px;border-radius:50%;font-size:18px;color:#fff" onclick="sets()">⚙</button></div><div style="border-top:1px solid #2a2b31;margin-top:10px;padding-top:8px;display:flex;justify-content:space-between;align-items:end"><span class="mu" style="letter-spacing:.2em">НА СЧЕТУ</span><b class="bal" style="font-size:24px">'+rub(S.bal)+'</b></div></div>'+
 '<div class="card" style="margin-top:16px" onclick="favp()"><div style="width:60px;height:70px;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#888;font-size:30px">'+(f?dev(f,24):"?")+'</div><div class="x"><span class="mu" style="letter-spacing:.1em">МОЙ ЛЮБИМЫЙ ТЕЛЕФОН</span><b>'+(f?f[0]:"Не выбран")+'</b><span class="mu">Нажми, чтобы выбрать</span></div>›</div><div class="kv"><span>Баланс</span><b class="bal">'+rub(S.bal)+'</b></div><div class="kv" style="margin-top:0"><span>Всего телефонов выпало</span><b>'+S.drop+'</b></div><div class="card" style="display:block"><h2 style="margin-top:0">Характеристика</h2>'+st+'</div>'+
 '<div class="card" onclick="achs()"><span style="font-size:36px">🏆</span><div class="x"><b>Ачивки</b><span class="mu">'+Object.keys(S.ach).length+' из '+AC.length+'</span></div>›</div><div class="card" onclick="code()"><span style="font-size:36px">🔑</span><div class="x"><b>Перенос аккаунта</b><span class="mu">Код сохранения</span></div>›</div><div class="card" onclick="wipe()"><span style="font-size:36px">🗑️</span><div class="x"><b style="color:var(--rd)">Стереть все данные игры</b><span class="mu">Начать с нуля</span></div>›</div>'}
function favp(){var h="";Object.keys(S.seen).forEach(function(i){var p=P[i];h+='<div class="ic" onclick="S.fav='+i+';shut();draw()">'+dev(p,40)+'<div style="font-size:11px;font-weight:700;margin-top:4px">'+p[0].slice(0,16)+'</div></div>'});
 sheet('<div class="t"><b>Любимый телефон</b><button class="done" onclick="shut()">Готово</button></div>'+(h?'<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:10px">'+h+'</div>':'<div class="mu">Сначала получи телефон.</div>'))}
function achs(){sheet('<div class="t"><b>Ачивки</b><button class="done" onclick="shut()">Готово</button></div>'+AC.map(function(a,i){return '<div class="row" style="opacity:'+(S.ach[i]?1:.6)+'"><span style="font-size:28px">'+a[0]+'</span><div class="x"><b>'+a[1]+'</b></div><b>'+(S.ach[i]?"✓":"+"+rub(a[3]))+'</b></div>'}).join(""))}
function code(){var o={};for(var k in S)if(k!="av")o[k]=S[k];var c=btoa(unescape(encodeURIComponent(JSON.stringify(o))));
 sheet('<div class="t"><b>Перенос аккаунта</b><button class="done" onclick="shut()">Готово</button></div><div class="mu" style="margin-bottom:8px">Скопируй код или вставь код с другого устройства:</div><textarea id="cd" rows="6">'+c+'</textarea><div style="display:flex;gap:10px;margin-top:12px"><button class="btn o" onclick="$(\'cd\').select();try{document.execCommand(\'copy\');toast(\'Скопировано\')}catch(e){}">Копировать</button><button class="btn" onclick="imp()">Загрузить</button></div>')}
function imp(){try{var d=JSON.parse(decodeURIComponent(escape(atob($("cd").value.trim()))));for(var k in d)S[k]=d[k];save();shut();draw();toast("Аккаунт загружен")}catch(e){toast("Неверный код")}}
function wipe(){sheet('<div style="text-align:center"><h2>Стереть все данные?</h2><p class="mu">Прогресс будет потерян.</p><div style="display:flex;gap:10px"><button class="btn o" onclick="shut()">Отмена</button><button class="btn r" onclick="try{localStorage.removeItem(K)}catch(e){};location.reload()">Стереть</button></div></div>')}
function tg_(k,l,d){return '<div class="tg" onclick="S.'+k+'=S.'+k+'?0:1;save();draw();sets()"><div><b>'+l+'</b><div class="mu">'+d+'</div></div><i class="'+(S[k]?"on":"")+'"></i></div>'}
function sets(){sheet('<div class="t"><b>Настройки</b><button class="done" onclick="shut()">Готово</button></div><div class="hd" style="margin-top:0">ПРОФИЛЬ</div><div class="av" style="width:90px;height:90px;border-radius:50%;border:3px solid var(--bl)">'+(S.av?'<img src="'+S.av+'">':'👤')+'</div><div style="margin:12px 0"><button class="sm" onclick="$(\'af\').click()">Выбрать фото</button> <button class="sm" onclick="S.av=\'\';save();draw();sets()">Убрать фото</button></div><input type="file" id="af" accept="image/*" style="display:none" onchange="ava(event)"><div class="mu">Имя</div><input type="text" value="'+S.name+'" oninput="S.name=this.value||\'Игрок\';save()"><div class="hd">ЦВЕТ ОБВОДКИ КАРТОЧКИ</div><div class="cols">'+CLRS.map(function(c){return '<div class="cl '+(c==S.col?"on":"")+'" style="background:'+c+'" onclick="S.col=\''+c+'\';save();draw();sets()"></div>'}).join("")+'</div><div class="tg"><span>Свой цвет</span><input type="color" value="'+S.col+'" onchange="S.col=this.value;save();draw()"></div><div class="hd">ЭФФЕКТЫ</div>'+tg_("glass","Жидкое стекло","Прозрачные размытые панели с бликами")+tg_("snow","Снег","Снег идёт на заднем фоне за всем интерфейсом")+'<div class="hd">ТЕМА ИГРЫ</div><div class="seg"><button class="'+(S.th=="l"?"on":"")+'" onclick="S.th=\'l\';save();draw();sets()">Белая</button><button class="'+(S.th=="d"?"on":"")+'" onclick="S.th=\'d\';save();draw();sets()">Чёрная</button></div>')}
function ava(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement("canvas");c.width=c.height=160;var m=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);S.av=c.toDataURL("image/jpeg",.8);save();draw();sets()};im.src=r.result};r.readAsDataURL(f)}
/* daily */
function dlst(){if(S.dl.last&&Date.now()-S.dl.last>DAY*2)S.dl.day=0;return!S.dl.last||Date.now()-S.dl.last>=DAY}
function daily(){var rd=dlst(),d=S.dl.day,h="";DR.forEach(function(r,i){var ok=i<d,cur=rd&&i==d;h+='<div class="day'+(ok?" ok":"")+(cur?" cur":"")+(i==6?" w":"")+'"><span>День '+(i+1)+'</span>'+(typeof r=="number"?'<b>'+rub(r)+'</b>':dev(P[pidx(r)],26)+'<b style="font-size:14px">'+r+'</b>')+'<span>'+(ok?"✓":"")+'</span></div>'});
 sheet('<div class="t"><b>Ежедневная награда</b><button class="done" onclick="shut()">Готово</button></div><div class="mu">Заходи каждый день: пропустишь день, и серия начнётся заново.</div><div class="days">'+h+'</div><button class="btn '+(rd?"":"o")+'" '+(rd?"":"disabled")+' onclick="claimD()">'+(rd?"Забрать награду (день "+(d%7+1)+")":"Уже забрано. Приходи завтра")+'</button>')}
function claimD(){if(!dlst())return;var d=S.dl.day%7;S.dl.day=d+1;S.dl.last=Date.now();toast("Получено: "+reward(DR[d]));save();draw();daily()}
setInterval(function(){var o=$("ob");if(o&&S.cs===0&&!busy){var l=S.free-Date.now();o.textContent=l>0?"Откроется через "+fmt(l).slice(3):"Открыть бесплатно";o.disabled=l>0}var c=$("ct");if(c&&S.ct){var l2=S.ct.end-Date.now();c.textContent=l2>0?"Осталось "+fmt(l2):"Готово!";if(l2<=0)ctv()}},1000);
window.addEventListener("pagehide",save);
var pend=!!S.upr;if(pend){S.tab=4;S.ang=0}draw();if(pend)fin();else if(dlst())setTimeout(daily,400);
</script><script src="https://zadano.github.io/mysite/track.js"></script>
</body></html>
