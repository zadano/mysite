<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Телефоны</title><meta name="color-scheme" content="light dark">
<style>
:root{--bg:#fff;--fg:#15161b;--mut:#8b8e9b;--card:#f0f1f6;--line:#e5e7ee;--bl:#2f6bff;--gr:#22b573;--rd:#e5484d}
[data-t=d]{--bg:#000;--fg:#f4f5f8;--card:#16171c;--line:#25262d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Rubik,Inter,system-ui,sans-serif;overflow:hidden}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
main{flex:1;overflow-y:auto;padding:14px 16px 20px;position:relative;z-index:1}
nav{display:flex;border-top:1px solid var(--line);padding:6px 4px;background:var(--bg);position:relative;z-index:2}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 11px inherit;font-family:inherit;padding:8px 0;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:5px}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--bl);background:rgba(47,107,255,.12)}
h2{margin:6px 0 12px;font-size:26px;font-weight:700}
.top{display:flex;align-items:center;gap:10px;margin:8px 0 14px}.top h2{margin:0;flex:1}
.pill{border:1px solid var(--line);border-radius:18px;padding:10px 16px;font-size:15px;color:var(--mut);background:var(--card)}.pill b{color:var(--fg);margin-left:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.card .x{flex:1}.card b{font-size:19px;display:block}.mu{color:var(--mut);font-size:14px;line-height:1.4}
.btn{width:100%;border:0;border-radius:18px;padding:17px;font:700 17px inherit;font-family:inherit;color:#fff;background:var(--bl)}
.btn:disabled{opacity:.4}.btn.g{background:var(--gr)}.btn.o{background:var(--card);color:var(--fg);border:1px solid var(--line)}.btn.r{background:var(--rd)}
.sm{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:14px;padding:10px 16px;font:700 14px inherit;font-family:inherit}
input.s{width:100%;border:0;background:var(--card);color:var(--fg);padding:15px 16px;border-radius:18px;font:inherit;font-size:17px;margin-bottom:14px;outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pc{position:relative}.pc .im{border-radius:24px;height:170px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden}
.pr{font-weight:800;font-size:22px}.nm{font-size:16px}.rr{font-weight:700;font-size:15px}
.heart{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;background:#fff;border:0;font-size:18px;color:#111}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc{border:1px solid var(--line);border-radius:22px;padding:16px 10px;text-align:center;background:var(--card);font-weight:600;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.bd{font-size:14px;border-radius:12px;padding:6px 14px;background:var(--bg);border:1px solid var(--line)}
.ci{display:flex;align-items:center;justify-content:center;background:#fff;object-fit:cover}
.strip{border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative;height:150px;margin:12px 0;background:var(--card)}
.in{display:flex;position:absolute;left:0;top:0;height:100%;align-items:center}
.it{width:90px;margin:0 5px;flex:none;border-radius:14px;padding:8px 2px;text-align:center;font-size:10px;font-weight:600;border-bottom:4px solid;background:var(--bg);height:128px;overflow:hidden}
.mkr{position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--bl);z-index:3}
.hd{font-size:13px;letter-spacing:.12em;font-weight:700;color:var(--mut);margin:20px 0 10px}
.row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:8px 14px;margin-bottom:8px}
.row .th{width:44px;flex:none}.row .x{flex:1;font-size:13px}.row b{font-size:15px;display:block}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:13px;border-radius:12px;font:700 17px inherit;font-family:inherit}.seg button.on{background:#16171c;color:#fff}[data-t=d] .seg button.on{background:#000;border:1px solid var(--line)}
.ic{border:2px solid var(--line);border-radius:20px;padding:8px;text-align:center;background:var(--card);font-size:12px;position:relative;overflow:hidden}
.ic.on{border-color:var(--bl)}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none;align-items:flex-end}.ov.on{display:flex}
.sh{background:var(--bg);border-radius:28px 28px 0 0;width:100%;max-height:92%;overflow-y:auto;padding:20px 16px 24px}
.sh .t{display:flex;align-items:center;margin-bottom:12px}.sh .t b{flex:1;font-size:24px}
.done{background:var(--bl);color:#fff;border:0;border-radius:16px;padding:14px 22px;font:700 17px inherit;font-family:inherit}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.day{border:2px solid var(--line);background:var(--card);border-radius:22px;min-height:120px;padding:10px 4px;text-align:center;font-size:13px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.day b{color:var(--fg);font-size:17px}.day.cur{border-color:var(--bl)}.day.ok{opacity:.45}.day.w{grid-column:span 2}
.coin{width:220px;height:220px;border-radius:50%;border:0;margin:14px auto;display:block;background:radial-gradient(circle at 30% 28%,#ffe58a,#ffc61f 60%,#e0a00f);box-shadow:0 0 50px rgba(255,190,30,.45);font-size:90px;font-weight:900;color:#b58a2e;touch-action:manipulation;user-select:none}
.coin.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.9) rotate(-4deg)}100%{transform:scale(1)}}
.fl{position:fixed;z-index:99;pointer-events:none;font-weight:800;font-size:22px;color:#e0a00f;text-shadow:0 1px 4px rgba(0,0,0,.35);animation:fl .9s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes fl{to{transform:translate(-50%,-190%) scale(1.25);opacity:0}}
.rp{position:fixed;z-index:98;pointer-events:none;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #ffc61f;animation:rp .5s ease-out forwards}
@keyframes rp{to{transform:scale(3.2);opacity:0}}
.spk{position:fixed;z-index:98;pointer-events:none;width:8px;height:8px;border-radius:50%;background:#ffd21f;animation:spk .6s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.prof{background:#0a0a0c;border:2px solid var(--c);border-radius:22px;padding:12px 14px;color:#fff;box-shadow:0 10px 30px -12px var(--c)}
.av{width:90px;height:90px;border-radius:26px;background:#1b1c21;border:2px solid #3a3b42;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}
.chip{display:inline-block;border:1px solid #2d2e35;border-radius:12px;padding:4px 9px;font-size:10px;letter-spacing:.1em;color:#a5a8b4;font-weight:600;margin:5px 4px 0 0}.prof .av{width:60px;height:60px;border-radius:18px;font-size:26px}
.bar{height:10px;border-radius:6px;margin:8px 0 16px}
.kv{display:flex;justify-content:space-between;color:var(--mut);margin:12px 6px;font-size:18px}.kv b{color:var(--fg)}
.dial{position:relative;width:240px;height:240px;margin:6px auto}.dial svg{width:100%;height:100%;position:absolute;inset:0}.nd{position:absolute;inset:0;transition:transform 4s cubic-bezier(.15,.7,.1,1)}
.slot{border:2px dashed var(--line);border-radius:22px;min-height:170px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--mut);padding:8px;font-size:15px}
.tg{display:flex;align-items:center;justify-content:space-between;font-size:17px;margin:14px 0}
.tg i{width:62px;height:36px;border-radius:20px;background:var(--card);border:1px solid var(--line);position:relative;display:block}.tg i:after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:.2s}.tg i.on{background:var(--bl)}.tg i.on:after{left:29px}
.cols{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}.cl{width:42px;height:42px;border-radius:50%;border:3px solid var(--line)}.cl.on{border-color:var(--fg)}
.sh input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:16px;padding:15px;font:inherit;font-size:17px}
.toast{position:absolute;left:20px;right:20px;bottom:90px;background:#1b1b24;color:#fff;padding:14px;border-radius:16px;text-align:center;opacity:0;transition:.3s;pointer-events:none;z-index:50}.toast.on{opacity:1}
#snow{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}#snow i{position:absolute;top:-20px;border-radius:50%;border:1px solid rgba(47,107,255,.5);animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
.glass #app{background:radial-gradient(circle at 20% 10%,#c9d8ff,transparent 50%),radial-gradient(circle at 90% 60%,#ffd3ea,transparent 50%)}
.glass .card,.glass .sh,.glass nav,.glass .cc,.glass .ic,.glass .row,.glass .pill{background:rgba(255,255,255,.4);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
[data-t=d].glass .card,[data-t=d].glass .sh,[data-t=d].glass nav,[data-t=d].glass .cc,[data-t=d].glass .ic,[data-t=d].glass .row,[data-t=d].glass .pill{background:rgba(30,32,40,.5)}
.glass{background:var(--bg)}
.spn{transform-box:fill-box;transform-origin:center;animation:sp 5s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.arm{animation:arm 5s cubic-bezier(.45,0,.2,1) infinite}@keyframes arm{0%,10%{transform:translateY(0)}45%,72%{transform:translateY(-15px)}100%{transform:translateY(0)}}
.dw{animation:dw 8s cubic-bezier(.45,0,.2,1) infinite}@keyframes dw{0%,12%{transform:translateX(52px)}42%,78%{transform:translateX(0)}100%{transform:translateX(52px)}}
.fr{transform-box:fill-box;transform-origin:left center;animation:fr 8s cubic-bezier(.45,0,.2,1) infinite}@keyframes fr{0%,12%{transform:scaleX(.02);opacity:0}20%{opacity:1}42%,78%{transform:scaleX(1);opacity:1}92%{opacity:1}100%{transform:scaleX(.02);opacity:0}}
@media(prefers-reduced-motion:reduce){.spn,.arm,.dw,.fr,.coin.pop{animation:none}}
</style></head><body><div id="app"><div id="snow"></div><main id="m"></main><nav id="nav"></nav><div class="ov" id="ov" onclick="if(event.target==this)shut()"><div class="sh" id="sh"></div></div><div class="toast" id="to"></div></div>
